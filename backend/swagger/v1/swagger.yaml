---
openapi: 3.0.1
info:
  title: TalkToAvatar API V1
  version: v1
  description: API documentation for TalkToAvatar backend
  contact:
    name: API Support
    email: support@talktoavatar.com
servers:
- url: http://localhost:3000
  description: Development server
- url: https://api.talktoavatar.com
  description: Production server
components:
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  "/api/v1/analyses":
    get:
      summary: Get all analyses
      tags:
      - Analyses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Analyses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    course_id:
                      type: string
                    analysis_type:
                      type: string
                    data:
                      type: object
                    summary:
                      type: string
                    created_at:
                      type: string
                      format: date_time
                    updated_at:
                      type: string
                      format: date_time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Create a new analysis
      tags:
      - Analyses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Analysis created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  analysis:
                    type: object
                    properties:
                      id:
                        type: string
                      course_id:
                        type: string
                      analysis_type:
                        type: string
                      data:
                        type: object
                      summary:
                        type: string
                      created_at:
                        type: string
                        format: date_time
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                analysis:
                  type: object
                  properties:
                    course_id:
                      type: string
                      example: uuid
                    analysis_type:
                      type: string
                      example: performance
                    data:
                      type: object
                      example:
                        score: 85
                    summary:
                      type: string
                      example: Analysis summary
                  required:
                  - course_id
                  - analysis_type
                  - data
  "/api/v1/analyses/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Analysis ID
      schema:
        type: string
    get:
      summary: Get analysis by ID
      tags:
      - Analyses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Analysis retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  course_id:
                    type: string
                  analysis_type:
                    type: string
                  data:
                    type: object
                  summary:
                    type: string
                  created_at:
                    type: string
                    format: date_time
                  updated_at:
                    type: string
                    format: date_time
        '404':
          description: Analysis not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      summary: Update an analysis
      tags:
      - Analyses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Analysis updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  analysis:
                    type: object
                    properties:
                      id:
                        type: string
                      course_id:
                        type: string
                      analysis_type:
                        type: string
                      data:
                        type: object
                      summary:
                        type: string
                      updated_at:
                        type: string
                        format: date_time
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                analysis:
                  type: object
                  properties:
                    analysis_type:
                      type: string
                    data:
                      type: object
                    summary:
                      type: string
    delete:
      summary: Delete an analysis
      tags:
      - Analyses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Analysis deleted successfully
        '404':
          description: Analysis not found
  "/api/v1/upload_audio":
    post:
      summary: Upload audio file
      tags:
      - Audio
      parameters: []
      responses:
        '200':
          description: Audio uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://example.com/audio.mp3
        '400':
          description: No audio file provided
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
        required: true
        description: Audio file
  "/api/v1/evaluate":
    post:
      summary: Evaluate pronunciation
      tags:
      - Audio
      parameters: []
      responses:
        '200':
          description: Pronunciation evaluated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  overall_score:
                    type: number
                    example: 85.5
                  accuracy:
                    type: number
                    example: 90.0
                  fluency:
                    type: number
                    example: 80.0
                  completeness:
                    type: number
                    example: 85.0
                  words:
                    type: array
                    items:
                      type: object
                      properties:
                        word:
                          type: string
                        accuracy_score:
                          type: number
                        error_type:
                          type: string
                        offset:
                          type: integer
                        duration:
                          type: integer
                  transcript:
                    type: string
                  reference_text:
                    type: string
                  score:
                    type: number
                  accuracy_score:
                    type: number
                  fluency_score:
                    type: number
                  completeness_score:
                    type: number
                  word_level_details:
                    type: array
                  feedback:
                    type: string
                  detailed_scores:
                    type: object
                    properties:
                      overall:
                        type: number
                      accuracy:
                        type: number
                      fluency:
                        type: number
                      completeness:
                        type: number
        '400':
          description: Missing required parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: file
          application/json:
            schema:
              type: file
        description: Audio file
  "/api/v1/auth/register":
    post:
      summary: Register a new user
      tags:
      - Authentication
      parameters: []
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user_id:
                    type: string
                  email:
                    type: string
                  email_sent:
                    type: boolean
                required:
                - message
                - user_id
                - email
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                      example: user@example.com
                    username:
                      type: string
                      example: johndoe
                    password:
                      type: string
                      example: Password123
                    password_confirmation:
                      type: string
                      example: Password123
                  required:
                  - email
                  - username
                  - password
                  - password_confirmation
  "/api/v1/auth/login":
    post:
      summary: Login user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      username:
                        type: string
                      created_at:
                        type: string
                        format: date_time
                required:
                - token
                - user
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                auth:
                  type: object
                  properties:
                    email:
                      type: string
                      example: user@example.com
                    password:
                      type: string
                      example: Password123
                  required:
                  - email
                  - password
  "/api/v1/auth/verify_email":
    post:
      summary: Verify email
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      username:
                        type: string
                      created_at:
                        type: string
                        format: date_time
                required:
                - message
                - token
                - user
        '422':
          description: Invalid verification code
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  example: uuid
                code:
                  type: string
                  example: '123456'
              required:
              - user_id
              - code
  "/api/v1/auth/resend_verification":
    post:
      summary: Resend verification code
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Verification code sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: string
                  example: uuid
              required:
              - user_id
  "/api/v1/auth/forgot_password":
    post:
      summary: Forgot password
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Password reset instructions sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  reset_token:
                    type: string
        '404':
          description: Email not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@example.com
              required:
              - email
  "/api/v1/auth/reset_password":
    post:
      summary: Reset password
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Invalid or expired token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  example: reset-token
                password:
                  type: string
                  example: NewPassword123
              required:
              - token
              - password
  "/api/v1/auth/profile":
    get:
      summary: Get user profile
      tags:
      - Authentication
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
                      created_at:
                        type: string
                        format: date_time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/auth/update_profile":
    put:
      summary: Update user profile
      tags:
      - Authentication
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      email:
                        type: string
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    username:
                      type: string
                      example: newusername
                  required:
                  - username
  "/api/v1/auth/change_password":
    put:
      summary: Change password
      tags:
      - Authentication
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '422':
          description: Current password incorrect
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password_change:
                  type: object
                  properties:
                    current_password:
                      type: string
                      example: Password123
                    new_password:
                      type: string
                      example: NewPassword123
                  required:
                  - current_password
                  - new_password
  "/api/v1/auth/delete_account":
    delete:
      summary: Delete account
      tags:
      - Authentication
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Account deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  "/api/v1/conversations":
    get:
      summary: Get all conversations
      tags:
      - Conversations
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Conversations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    user_text:
                      type: string
                    translated_text:
                      type: string
                    user_language:
                      type: string
                    target_language:
                      type: string
                    created_at:
                      type: string
                      format: date_time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Create a new conversation
      tags:
      - Conversations
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Conversation saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  conversation:
                    type: object
                    properties:
                      id:
                        type: string
                      user_text:
                        type: string
                      translated_text:
                        type: string
                      user_language:
                        type: string
                      target_language:
                        type: string
                      created_at:
                        type: string
                        format: date_time
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation:
                  type: object
                  properties:
                    user_text:
                      type: string
                      example: Hello
                    translated_text:
                      type: string
                      example: Hola
                    user_language:
                      type: string
                      example: en
                    target_language:
                      type: string
                      example: es
                  required:
                  - user_text
                  - translated_text
                  - user_language
                  - target_language
  "/api/v1/conversations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Conversation ID
      schema:
        type: string
    get:
      summary: Get conversation by ID
      tags:
      - Conversations
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Conversation retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  user_text:
                    type: string
                  translated_text:
                    type: string
                  user_language:
                    type: string
                  target_language:
                    type: string
                  created_at:
                    type: string
                    format: date_time
                  updated_at:
                    type: string
                    format: date_time
        '404':
          description: Conversation not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    delete:
      summary: Delete a conversation
      tags:
      - Conversations
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Conversation deleted successfully
        '404':
          description: Conversation not found
  "/api/v1/courses":
    get:
      summary: List all courses
      tags:
      - Courses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Courses retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    title:
                      type: string
                    description:
                      type: string
                    language_code:
                      type: string
                    level:
                      type: string
                    status:
                      type: string
                    created_at:
                      type: string
                      format: date_time
                    updated_at:
                      type: string
                      format: date_time
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    post:
      summary: Create a new course
      tags:
      - Courses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '201':
          description: Course created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  course:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      language_code:
                        type: string
                      level:
                        type: string
                      status:
                        type: string
                      created_at:
                        type: string
                        format: date_time
        '422':
          description: Validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: English A1 Course
                description:
                  type: string
                  example: Beginner English course
                language_code:
                  type: string
                  example: en
                level:
                  type: string
                  example: A1
              required:
              - title
              - language_code
              - level
  "/api/v1/courses/{id}":
    parameters:
    - name: id
      in: path
      required: true
      description: Course ID
      schema:
        type: string
    get:
      summary: Get a course
      tags:
      - Courses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Course retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  language_code:
                    type: string
                  level:
                    type: string
                  status:
                    type: string
                  created_at:
                    type: string
                    format: date_time
                  updated_at:
                    type: string
                    format: date_time
        '404':
          description: Course not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      summary: Update a course
      tags:
      - Courses
      security:
      - bearer_auth: []
      parameters: []
      responses:
        '200':
          description: Course updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  course:
                    type: object
                    properties:
                      id:
                        type: string
                      title:
                        type: string
                      description:
                        type: string
                      language_code:
                        type: string
                      level:
                        type: string
                      status:
                        type: string
                      updated_at:
                        type: string
                        format: date_time
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                language_code:
                  type: string
                level:
                  type: string
    delete:
      summary: Delete a course
      tags:
      - Courses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Course deleted successfully
  "/api/v1/courses/{id}/subjects":
    parameters:
    - name: id
      in: path
      required: true
      description: Course ID
      schema:
        type: string
    get:
      summary: Get course subjects
      tags:
      - Courses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Subjects retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    topic:
                      type: string
                    title:
                      type: string
                    progress_percentage:
                      type: number
                    completed_sentences:
                      type: integer
                    total_sentences:
                      type: integer
  "/api/v1/courses/{id}/recordings":
    parameters:
    - name: id
      in: path
      required: true
      description: Course ID
      schema:
        type: string
    get:
      summary: Get course recordings
      tags:
      - Courses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Recordings retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    topic:
                      type: string
                    topic_title:
                      type: string
                    sentences:
                      type: array
                      items:
                        type: object
                        properties:
                          sentence_id:
                            type: string
                          sentence:
                            type: string
                          recordings:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                score:
                                  type: number
                                created_at:
                                  type: string
                                  format: date_time
  "/api/v1/courses/{id}/reports":
    parameters:
    - name: id
      in: path
      required: true
      description: Course ID
      schema:
        type: string
    get:
      summary: Get course reports
      tags:
      - Courses
      security:
      - bearer_auth: []
      responses:
        '200':
          description: Reports retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
